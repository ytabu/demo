<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Noto Sans CJK JP', 'IPAGothic', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="railway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a3a"/>
      <stop offset="1" stop-color="#2980b9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1a2a3a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2980b9"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#1a2a3a">サイト公開までの構成図</text>
  <text x="500" y="86" text-anchor="middle" font-size="15" fill="#5a6b7a">コードを書く → GitHub で管理 → Railway で自動公開</text>

  <!-- ===== Left column: two input sources ===== -->

  <!-- Source 1: Windows PC + VSCode -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="280" height="150" rx="16" fill="#ffffff" stroke="#d6eaf8" stroke-width="2"/>
  </g>
  <g stroke="#2980b9" fill="none" stroke-width="3" stroke-linejoin="round">
    <rect x="178" y="146" width="44" height="30" rx="3"/>
    <path d="M172 186 L228 186 L224 178 L176 178 Z" fill="#2980b9" stroke="none"/>
  </g>
  <text x="200" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2a3a">Windows PC</text>
  <text x="200" y="248" text-anchor="middle" font-size="14" fill="#5a6b7a">VS Code で Claude に指示</text>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#7a8b9a">AIがコードを書いて push</text>

  <!-- Source 2: Smartphone Claude app -->
  <g filter="url(#shadow)">
    <rect x="60" y="350" width="280" height="150" rx="16" fill="#ffffff" stroke="#d6eaf8" stroke-width="2"/>
  </g>
  <g stroke="#2980b9" fill="none" stroke-width="3" stroke-linejoin="round">
    <rect x="184" y="356" width="32" height="50" rx="6"/>
    <line x1="195" y1="363" x2="205" y2="363" stroke-width="2.5"/>
    <circle cx="200" cy="399" r="2" fill="#2980b9" stroke="none"/>
  </g>
  <text x="200" y="432" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2a3a">スマホ Claude アプリ</text>
  <text x="200" y="458" text-anchor="middle" font-size="14" fill="#5a6b7a">AIに指示して操作</text>
  <text x="200" y="480" text-anchor="middle" font-size="13" fill="#7a8b9a">GitHub を直接編集</text>

  <!-- ===== Middle: GitHub ===== -->
  <g filter="url(#shadow)">
    <rect x="430" y="245" width="240" height="150" rx="16" fill="#1a2433"/>
  </g>
  <g fill="#aed6f1" stroke="#aed6f1">
    <line x1="540" y1="262" x2="540" y2="286" stroke-width="3"/>
    <path d="M540 270 C540 280 562 274 562 284" fill="none" stroke-width="3"/>
    <circle cx="540" cy="258" r="6" stroke="none"/>
    <circle cx="540" cy="290" r="6" stroke="none"/>
    <circle cx="562" cy="288" r="6" stroke="none"/>
  </g>
  <text x="550" y="332" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">GitHub</text>
  <text x="550" y="358" text-anchor="middle" font-size="14" fill="#aed6f1">コードを管理・保存</text>
  <text x="550" y="380" text-anchor="middle" font-size="13" fill="#8fb8d4">PR をマージして反映</text>

  <!-- ===== Right: Railway ===== -->
  <g filter="url(#shadow)">
    <rect x="730" y="245" width="210" height="150" rx="16" fill="url(#railway)"/>
  </g>
  <g stroke="#aed6f1" fill="none" stroke-width="2.5">
    <rect x="813" y="256" width="44" height="12" rx="2.5"/>
    <rect x="813" y="271" width="44" height="12" rx="2.5"/>
    <rect x="813" y="286" width="44" height="12" rx="2.5"/>
    <circle cx="820" cy="262" r="1.6" fill="#aed6f1" stroke="none"/>
    <circle cx="820" cy="277" r="1.6" fill="#aed6f1" stroke="none"/>
    <circle cx="820" cy="292" r="1.6" fill="#aed6f1" stroke="none"/>
  </g>
  <text x="835" y="332" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Railway</text>
  <text x="835" y="358" text-anchor="middle" font-size="14" fill="#aed6f1">自動ビルド・公開</text>
  <text x="835" y="380" text-anchor="middle" font-size="13" fill="#8fb8d4">インターネットへ</text>

  <!-- ===== Arrows ===== -->
  <!-- PC -> GitHub -->
  <path d="M345,215 C390,215 400,295 423,295" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Phone -> GitHub -->
  <path d="M345,425 C390,425 400,345 423,345" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- GitHub -> Railway -->
  <path d="M675,320 L723,320" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== Internet output ===== -->
  <g filter="url(#shadow)">
    <rect x="730" y="455" width="210" height="90" rx="16" fill="#ffffff" stroke="#d6eaf8" stroke-width="2"/>
  </g>
  <g stroke="#2980b9" fill="none" stroke-width="2.5">
    <circle cx="835" cy="487" r="17"/>
    <ellipse cx="835" cy="487" rx="7" ry="17"/>
    <line x1="818" y1="487" x2="852" y2="487"/>
    <line x1="822" y1="477" x2="848" y2="477"/>
    <line x1="822" y1="497" x2="848" y2="497"/>
  </g>
  <text x="835" y="525" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2a3a">世界中に公開</text>
  <!-- Railway -> Internet -->
  <path d="M835,395 L835,450" fill="none" stroke="#2980b9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="500" y="612" text-anchor="middle" font-size="13" fill="#9aabb8">PC でも スマホ でも、どちらのルートからでも同じ仕組みで公開できる</text>
</svg>
